# The project name is the app name, so the rename codemod keeps it in step with tools/worktree.
name: bibi

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bibi
      POSTGRES_PASSWORD: bibi
      POSTGRES_DB: bibi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibi -d bibi"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { APP: web }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bibi:bibi@postgres:5432/bibi
      SMTP_URL: smtp://mailpit:1025
      MCP_URL: http://mcp:3001
      STORAGE_DISK_DIR: /app/.storage
    volumes:
      - storage-data:/app/.storage
    ports:
      - "3330:3330"
    depends_on:
      postgres: { condition: service_healthy }

  mcp:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { APP: mcp }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bibi:bibi@postgres:5432/bibi
      WEB_URL: http://web:3000
    ports:
      - "3331:3331"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { APP: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bibi:bibi@postgres:5432/bibi
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  storage-data:
