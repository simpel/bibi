# Production service definition (ADR 0013). Deployed by Coolify. No host ports are published: the proxy
# routes app. and mcp. to the containers. To run it directly, add a reverse proxy or a temporary ports mapping:
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Images are built in GitHub Actions and published to GHCR tagged with the git SHA.
# Secrets come from the environment (Coolify / --env-file), never from the repo.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://bibi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bibi
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
  WEB_URL: ${WEB_URL:?set WEB_URL}
  MCP_URL: ${MCP_URL:?set MCP_URL}
  # ADR 0073: the public site's host (apex). Empty = no host rules.
  PUBLIC_URL: ${PUBLIC_URL:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  # ADR 0012: set MAIL_PROVIDER=resend with RESEND_API_KEY (EU region) for production mail.
  MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  WEB_OAUTH_CLIENT_ID: ${WEB_OAUTH_CLIENT_ID:-}
  # ADR 0063: uploaded files live in Hetzner Object Storage (docs/runbooks/object-storage.md).
  # Required: the containers' disk is wiped on every deploy, so there is no disk fallback.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:?set S3_REGION}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}

# Memory: every service has a limit so one runaway process cannot take the whole server (the host
# also runs Coolify and its proxy); Node's heap is capped below its container's limit so it collects
# garbage instead of being OOM-killed. See "Disk and memory" in docs/runbooks/deploy.md.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 1g
    # Sized for a 4 GB host. max_connections must stay above the pools: web, mcp and worker
    # (DATABASE_POOL_MAX each, default 10), pg-boss's own pool, the notification listener and backup.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
    environment:
      POSTGRES_USER: bibi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bibi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibi -d bibi"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-off step: applies pending migrations and exits. web and mcp wait for it.
  # Migrations must be backward compatible (expand/contract), see docs/decisions/0013-hosting-and-deploy.md.
  migrate:
    # Its own image (packages/db and the Prisma CLI) runs `prisma migrate deploy`.
    image: ${IMAGE_REPO:-ghcr.io/simpel/bibi}-migrate:${IMAGE_TAG:?set IMAGE_TAG to the git sha}
    restart: "no"
    mem_limit: 512m
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://bibi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bibi
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  web:
    image: ${IMAGE_REPO:-ghcr.io/simpel/bibi}-web:${IMAGE_TAG:?set IMAGE_TAG to the git sha}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=576
    # Not published: Coolify's proxy reaches the container on this internal port.
    expose:
      - "3330"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3330/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging: *logging

  mcp:
    image: ${IMAGE_REPO:-ghcr.io/simpel/bibi}-mcp:${IMAGE_TAG:?set IMAGE_TAG to the git sha}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=288
    expose:
      - "3331"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3331/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging: *logging

  # Job scheduler and queue (pg-boss, ADR 0027). No HTTP port. pg-boss migrates its own `pgboss`
  # schema on start. Graceful stop: SIGTERM runs `boss.stop()`, so give running jobs time to finish.
  worker:
    image: ${IMAGE_REPO:-ghcr.io/simpel/bibi}-worker:${IMAGE_TAG:?set IMAGE_TAG to the git sha}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=288
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      disable: true
    logging: *logging

  # Nightly pg_dump to S3-compatible storage (Hetzner Object Storage) with retention.
  # See docs/operations/backup-and-restore.md. Built in CI from docker/backup/Dockerfile, so the
  # server never builds images (a build leaves a cache on its disk).
  backup:
    image: ${IMAGE_REPO:-ghcr.io/simpel/bibi}-backup:${IMAGE_TAG:?set IMAGE_TAG to the git sha}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: bibi
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: bibi
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
      # Optional alerting: ping after a successful / failed backup (see the backup runbook).
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_FAILURE_URL: ${BACKUP_FAILURE_URL:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?set BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?set BACKUP_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-eu-central}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  postgres-data:
