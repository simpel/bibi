name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bibi
          POSTGRES_PASSWORD: bibi
          POSTGRES_DB: bibi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bibi" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bibi:bibi@localhost:5432/bibi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-123
      BETTER_AUTH_URL: http://localhost:3330
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checks (lint, structure, typecheck, migrate, test) are defined once in tools/ci/checks.json and
      # run locally by the implement skill before it commits. build runs in e2e, storybook in its own job.
      - run: node tools/ci/verify.mjs --all

  tools:
    # The check runner and the time rule have their own tests (no database needed).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tools/ci/verify.test.mjs tools/ci/ship.test.mjs tools/lib/time-rules.test.mjs

  storybook:
    # A broken story fails the build (ADR 0002).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/verify.mjs --only storybook

  e2e:
    # Playwright against a production build with the scripted model (ADR 0002, 0007).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bibi
          POSTGRES_PASSWORD: bibi
          POSTGRES_DB: bibi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bibi" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # Sign-in is magic link only (ADR 0005): e2e reads the link from Mailpit's API.
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://bibi:bibi@localhost:5432/bibi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-123
      BETTER_AUTH_URL: http://localhost:3330
      WEB_URL: http://localhost:3330
      E2E_MOCK_MODEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm --filter @bibi/core seed:skills
      - name: Provision the assistant's OAuth client
        run: |
          pnpm --filter @bibi/web provision:oauth | tee provision.log
          grep -E '^WEB_OAUTH_CLIENT_ID=' provision.log >> "$GITHUB_ENV"
      # The full build (web, mcp, worker); e2e runs against the web build, so check does not build again.
      - run: node tools/ci/verify.mjs --only build
      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @bibi/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @bibi/web exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @bibi/web exec playwright install-deps chromium
      - run: pnpm --filter @bibi/web test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
