name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: okazi
          POSTGRES_PASSWORD: okazi
          POSTGRES_DB: okazi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okazi" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://okazi:okazi@localhost:5432/okazi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-123
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm check:structure
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
