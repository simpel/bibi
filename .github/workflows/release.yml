name: Release
# Semantic versioning from Conventional Commits (ADR 0060). On every push to main, release-please opens or updates a
# release PR that bumps the version in every package.json and writes CHANGELOG.md. Merging that PR creates the
# vX.Y.Z git tag and the GitHub release, which triggers the publish-images and deploy jobs to production.
# Run it by hand on main (workflow_dispatch) to build and deploy main's head without a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # The release PR is opened with the bibi-release app's token, not GITHUB_TOKEN: GitHub runs no workflows on
      # PRs that GITHUB_TOKEN opens, and the release PR needs CI before it merges.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One image per entry: `target` is the stage in its Dockerfile, `app` the workspace it builds.
        include:
          - { image: web, file: docker/Dockerfile, target: web, app: web }
          - { image: worker, file: docker/Dockerfile, target: node, app: worker }
          - { image: migrate, file: docker/Dockerfile, target: migrate, app: db }
          # Cached so its layers (Postgres client, AWS CLI) keep their digests and the server pulls
          # nothing new for it when only the app changed.
          - { image: backup, file: docker/backup/Dockerfile, target: "", app: "", cache: true }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cache && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,scope={0},mode=max', matrix.image) || '' }}
          # No layer cache for the app images: every release changes the source, so only the
          # `pnpm install` layer (~20 s) could hit, while exporting the cache (mode=max) took ~6 of the
          # web image's ~10 minutes.

  deploy:
    # Rolls out the SHA that publish-images just pushed (ADR 0013). Rollback: rollback.yml.
    needs: [release-please, publish-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      environment: production
    secrets: inherit
