name: Release
# Semantic versioning from Conventional Commits (ADR 0060). On every push to main, release-please opens or updates a
# release PR that bumps the version in every package.json and writes CHANGELOG.md. Merging that PR creates the
# vX.Y.Z git tag and the GitHub release, which triggers the publish-images and deploy jobs to production.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, mcp, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    # Rolls out the SHA that publish-images just pushed (ADR 0013). Rollback: rollback.yml.
    needs: [release-please, publish-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      environment: production
    secrets: inherit
