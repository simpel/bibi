name: Release
# Semantic versioning from Conventional Commits (ADR 0060). On every push to main, release-please opens or updates a
# release PR that bumps the version in every package.json and writes CHANGELOG.md. Merging that PR creates the
# vX.Y.Z git tag and the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
