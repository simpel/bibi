name: Backup restore test
# Dumps a migrated database with the real backup image and restores it with tools/backup/restore-test.sh,
# so a regression in the dump or restore path (for example a Postgres or pgvector upgrade) fails CI.
on:
  push:
    branches: [main]
    paths:
      - docker/backup/**
      - tools/backup/**
      - packages/db/prisma/migrations/**
      - .github/workflows/backup-restore.yml
  pull_request:
    paths:
      - docker/backup/**
      - tools/backup/**
      - packages/db/prisma/migrations/**
      - .github/workflows/backup-restore.yml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  restore-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: okazi
          POSTGRES_PASSWORD: okazi
          POSTGRES_DB: okazi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okazi" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://okazi:okazi@localhost:5432/okazi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-123
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Seed the database (migrations and system skills)
        run: |
          pnpm db:migrate
          pnpm --filter @okazi/core seed:skills
      - name: Build the backup image
        run: docker build -f docker/backup/Dockerfile -t okazi-backup .
      - name: Dump with backup.sh in local mode
        run: |
          mkdir -p "$RUNNER_TEMP/dumps"
          docker run --rm --network host --entrypoint backup.sh \
            -e PGHOST=localhost -e PGUSER=okazi -e PGPASSWORD=okazi -e PGDATABASE=okazi \
            -e BACKUP_LOCAL_DIR=/dumps -v "$RUNNER_TEMP/dumps:/dumps" okazi-backup
          ls -l "$RUNNER_TEMP/dumps"
      - name: Restore test
        run: tools/backup/restore-test.sh "$(ls "$RUNNER_TEMP"/dumps/okazi-*.dump | tail -1)"
