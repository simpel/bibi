name: Deploy
# Reusable deploy of one image SHA to a Coolify environment (ADR 0013).
# Called by CI after publish-images (deploy) and by rollback.yml (redeploy of an earlier SHA).
on:
  workflow_call:
    inputs:
      sha:
        description: Full git SHA whose images are already in GHCR
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment; never cancel one that is rolling out.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # Coolify is reached through the SSH tunnel opened below.
      COOLIFY_URL: ${{ secrets.DEPLOY_HOST && 'http://localhost:8000' || '' }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Skip when Coolify is not configured
        id: cfg
        run: |
          if [ -z "$COOLIFY_URL" ]; then
            echo "::warning::DEPLOY_HOST is not set; skipping deploy (production only until the first paying venue, ADR 0031)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check that the images exist
        if: steps.cfg.outputs.configured == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for app in web mcp worker; do
            docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}-${app}:${SHA}" > /dev/null
          done
      - name: Open SSH tunnel to Coolify (its port is not public, ADR 0013)
        if: steps.cfg.outputs.configured == 'true'
        # The `deploy` user's key may only forward to localhost:8000 (tools/server/bootstrap.sh).
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -fN -o ExitOnForwardFailure=yes -L 8000:localhost:8000 "deploy@${{ secrets.DEPLOY_HOST }}"
      - name: Set image tag and trigger rollout in Coolify
        if: steps.cfg.outputs.configured == 'true'
        # One Coolify Docker Compose resource runs docker-compose.prod.yml (migrate, web, mcp, worker),
        # so setting IMAGE_TAG and redeploying rolls out every service on the same SHA.
        run: |
          uuid="${{ secrets.COOLIFY_APP_UUID }}"
          curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$uuid/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\": \"IMAGE_TAG\", \"value\": \"${SHA}\"}" > /dev/null
          curl -fsS "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
      - name: Health gate
        if: steps.cfg.outputs.configured == 'true'
        run: |
          for url in "${{ vars.WEB_URL }}/api/health" "${{ vars.MCP_URL }}/health"; do
            ok=false
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 "$url" > /dev/null; then ok=true; break; fi
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Health gate failed for $url after rollout of $SHA. Run the Rollback workflow with the previous SHA."
              exit 1
            fi
          done
