name: Deploy
# Reusable deploy of one image SHA to a Coolify environment (ADR 0013).
# Called by CI after publish-images (deploy) and by rollback.yml (redeploy of an earlier SHA).
on:
  workflow_call:
    inputs:
      sha:
        description: Full git SHA whose images are already in GHCR
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment; never cancel one that is rolling out.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # Coolify is reached through the SSH tunnel opened below.
      COOLIFY_URL: ${{ secrets.DEPLOY_HOST && 'http://localhost:8000' || '' }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Skip when Coolify is not configured
        id: cfg
        run: |
          if [ -z "$COOLIFY_URL" ]; then
            echo "::warning::DEPLOY_HOST is not set; skipping deploy (production only until the first paying venue, ADR 0031)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check that the images exist
        if: steps.cfg.outputs.configured == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for app in web worker migrate backup; do
            docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}-${app}:${SHA}" > /dev/null
          done
      - name: Open SSH tunnel to Coolify (its port is not public, ADR 0013)
        if: steps.cfg.outputs.configured == 'true'
        # The `deploy` user's key may only forward to localhost:8000 (tools/server/bootstrap.sh).
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -fN -o ExitOnForwardFailure=yes -L 8000:localhost:8000 "deploy@${{ secrets.DEPLOY_HOST }}"
      # Coolify runs one deployment per resource at a time: a stuck earlier one (status left at
      # in_progress after its build container died) silently queues every later deploy behind it.
      - name: No earlier Coolify deployment is still running
        if: steps.cfg.outputs.configured == 'true'
        run: |
          uuid="${{ secrets.COOLIFY_APP_UUID }}"
          running=$(curl -sS --fail-with-body "$COOLIFY_URL/api/v1/deployments/applications/$uuid?take=10" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            | jq -r '(if type == "array" then . else .deployments // [] end)[]
                | select(.status == "queued" or .status == "in_progress")
                | "\(.deployment_uuid) \(.status) since \(.created_at)"')
          if [ -n "$running" ]; then
            echo "$running"
            echo "::error::An earlier Coolify deployment is still running. Cancel it in Coolify if it is stuck (docs/runbooks/deploy.md), then re-run this job."
            exit 1
          fi
      - name: Set image tag and trigger rollout in Coolify
        if: steps.cfg.outputs.configured == 'true'
        # One Coolify Docker Compose resource runs docker-compose.prod.yml (migrate, web, worker, backup); web also serves MCP (ADR 0104),
        # so setting IMAGE_TAG and redeploying rolls out every service on the same SHA.
        id: trigger
        run: |
          uuid="${{ secrets.COOLIFY_APP_UUID }}"
          curl -sS --fail-with-body -o /dev/null -X PATCH "$COOLIFY_URL/api/v1/applications/$uuid/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\": \"IMAGE_TAG\", \"value\": \"${SHA}\"}"
          response=$(curl -sS --fail-with-body -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")
          echo "$response"
          deployment=$(echo "$response" | jq -er '.deployments[0].deployment_uuid')
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
      # The old containers keep answering the health checks while a rollout fails, so the job
      # follows Coolify's own deployment status and fails with its log when the rollout fails.
      - name: Wait for the Coolify rollout
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: |
          for i in $(seq 1 120); do
            body=$(curl -sS --fail-with-body "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" \
              -H "Authorization: Bearer $COOLIFY_TOKEN")
            status=$(echo "$body" | jq -r '.status')
            echo "Coolify deployment $DEPLOYMENT: $status"
            case "$status" in
              finished) exit 0 ;;
              queued|in_progress) sleep 10 ;;
              *)
                echo "$body" | jq -r '.logs // "[]" | fromjson? // [] | .[] | select(.hidden != true) | .output'
                echo "::error::Coolify rollout of $SHA ended as '$status'. Production still runs the previous SHA."
                exit 1 ;;
            esac
          done
          echo "::error::Coolify rollout of $SHA did not finish in 20 minutes."
          exit 1
      - name: Health gate
        if: steps.cfg.outputs.configured == 'true'
        run: |
          for url in "${{ vars.WEB_ORIGIN }}/api/health" "${{ vars.MCP_ORIGIN }}/health"; do
            ok=false
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 "$url" > /dev/null; then ok=true; break; fi
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Health gate failed for $url after rollout of $SHA. Run the Rollback workflow with the previous SHA."
              exit 1
            fi
          done
